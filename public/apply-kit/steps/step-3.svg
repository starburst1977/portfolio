<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t3">
  <title id="t3">Paste a job ad and get a tailored CV and cover letter as PDFs</title>
  <!-- back sheet: letter -->
  <g transform="rotate(-9 128 124)">
    <rect x="86" y="54" width="86" height="116" rx="4" fill="#fff" stroke="#1F1B16" stroke-width="2.5"/>
    <path d="M100 74h30" stroke="#1F1B16" stroke-width="3"/>
    <path d="M100 94h58M100 104h52M100 114h58M100 124h40M100 142h28" stroke="#6B635A" stroke-width="2"/>
  </g>
  <!-- front sheet: CV -->
  <g transform="rotate(7 190 124)">
    <rect x="146" y="58" width="90" height="120" rx="4" fill="#fff" stroke="#1F1B16" stroke-width="2.5"/>
    <path d="M176 76h30" stroke="#1F1B16" stroke-width="3.5"/>
    <path d="M168 86h46" stroke="#6B635A" stroke-width="2"/>
    <path d="M160 102h14" stroke="#B85C38" stroke-width="3"/>
    <path d="M160 112h62M160 121h54M160 130h62" stroke="#6B635A" stroke-width="2"/>
    <path d="M160 146h14" stroke="#B85C38" stroke-width="3"/>
    <path d="M160 156h58M160 165h48" stroke="#6B635A" stroke-width="2"/>
  </g>
  <!-- PDF tag -->
  <g transform="rotate(-6 106 184)">
    <rect x="80" y="170" width="54" height="28" rx="6" fill="#B85C38" stroke="#1F1B16" stroke-width="2.5"/>
    <text x="107" y="190" text-anchor="middle" font-family="'Source Sans 3', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="1">PDF</text>
  </g>
  <!-- done -->
  <circle cx="246" cy="62" r="17" fill="#1F1B16"/>
  <path d="M238 62l6 6 11-12" stroke="#fff" stroke-width="3"/>
  <!-- confetti -->
  <path d="M60 70v12M54 76h12" stroke="#B85C38" stroke-width="2.5"/>
  <rect x="270" y="112" width="9" height="9" rx="1.5" fill="#E5DDD0" transform="rotate(20 274 116)"/>
  <rect x="64" y="126" width="8" height="8" rx="1.5" fill="#B85C38" transform="rotate(-18 68 130)"/>
  <circle cx="276" cy="166" r="3.5" fill="#B85C38"/>
  <circle cx="220" cy="30" r="3" fill="#E5DDD0"/>
  <path d="M270 200l8-4" stroke="#1F1B16" stroke-width="2"/>
</svg>
